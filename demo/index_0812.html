.hp *{box-sizing:border-box;margin:0;padding:0}
.hp :where(button){font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
.hp :where(input,select){font-family:inherit}
.hp button:focus-visible,.hp input:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}

.dbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--paper);
  border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3);flex-wrap:wrap}
.dbar .tg{font-family:var(--mono);font-size:9px;letter-spacing:.15em;border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;color:var(--ink3)}
.dbar .now{font-weight:600;color:var(--ink);font-size:12.5px}
.dbar .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink3)}
.dbar .sp{margin-left:auto;display:flex;align-items:center;gap:7px}
.selw{position:relative;display:inline-flex}
.selw select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);
  font-family:inherit;font-size:12px;line-height:1.2;padding:7px 27px 7px 11px;cursor:pointer}
.selw select:hover{border-color:var(--dawn)}
.selw i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;
  color:var(--ink3);pointer-events:none;font-style:normal}
.dbar .rs{border:1px solid var(--line);border-radius:4px;background:#fff;width:30px;height:30px;
  display:grid;place-items:center;font-size:14px;color:var(--ink2);text-align:center}
.dbar .rs:hover{border-color:var(--dawn);color:var(--ink)}

.stage{flex:1;display:grid;place-items:start center;padding:24px 15px 34px}
.f{width:100%;max-width:404px}
.g{width:100%;max-width:720px}

/* \u2500\u2500 \uC5B4\uB974\uC2E0 \u2500\u2500 */
.eS{background:var(--dawn);border-radius:26px;overflow:hidden;color:#fff;min-height:596px;
  display:flex;flex-direction:column;box-shadow:0 22px 46px -18px rgba(18,54,66,.5)}
.eT{display:flex;justify-content:space-between;padding:15px 22px 0;
  font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.45)}
.eB{flex:1;display:flex;flex-direction:column;padding:20px 24px 26px}
.eP{height:4px;background:rgba(255,255,255,.14)}
.eP i{display:block;height:100%;background:var(--gold);transition:width .35s}
.hint{font-size:12.5px;background:rgba(217,145,31,.18);color:#F4CE93;border-left:2px solid var(--gold);
  padding:8px 11px;margin-bottom:16px;line-height:1.4}
.qtop{display:flex;align-items:center;gap:10px}
.qc{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.12em}
.tagc{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;background:rgba(255,255,255,.14);
  border-radius:999px;padding:3px 9px;color:rgba(255,255,255,.7)}
.spk{margin-left:auto;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.28);
  border-radius:999px;padding:6px 13px;font-size:12.5px;color:rgba(255,255,255,.85);white-space:nowrap}
.spk:hover{background:rgba(255,255,255,.13)}
.spk.on{border-color:var(--gold);color:#F4CE93}
.qt{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;margin:16px 0 auto;line-height:1.3}
.ch{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.chb{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);color:#fff;
  font-weight:600;padding:20px 22px;border-radius:6px;transition:background .15s,border-color .15s,transform .09s}
.chb:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.chb:active{transform:scale(.985)}
.chb small{display:block;font-size:12.5px;font-weight:400;color:rgba(255,255,255,.5);margin-top:3px}
.chb.w{background:#fff;color:var(--dawn);border-color:#fff;text-align:center}
.back{margin-top:15px;align-self:flex-start;font-size:13px;color:rgba(255,255,255,.45);
  border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:1px}
.back:hover{color:#fff}
.sent{font-family:var(--serif);font-size:26px;line-height:1.4;font-weight:700;
  background:rgba(255,255,255,.09);border-radius:8px;padding:19px;margin:16px 0}
.rec{display:flex;flex-direction:column;align-items:center;gap:13px;margin-top:auto}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:50px}
.wave i{width:5px;border-radius:3px;background:var(--gold);transition:height .12s}
.rbtn{width:100%;background:var(--gold);color:#1a1205;font-size:21px;font-weight:700;
  padding:20px;border-radius:6px;text-align:center}
.rbtn.s{background:#fff;color:var(--red)}
.rt{font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.08em}
.skip{font-size:13.5px;color:rgba(255,255,255,.42);border-bottom:1px solid rgba(255,255,255,.22)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px}
.tick{width:62px;height:62px;border-radius:50%;border:2.5px solid var(--gold);
  display:grid;place-items:center;font-size:28px;color:var(--gold)}
.done h3{font-family:var(--serif);font-size:29px;font-weight:700;letter-spacing:-.02em}
.done p{font-size:14.5px;color:rgba(255,255,255,.6);max-width:18em}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.y{background:var(--jade)}
.lt{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);border-radius:8px;
  padding:15px;margin-top:16px}
.lt .fr{font-size:12.5px;color:rgba(255,255,255,.5)}
.lt .tl{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:3px}
.vid{aspect-ratio:3/4;background:linear-gradient(150deg,#2B6478,#123642);border-radius:8px;
  display:grid;place-items:center;text-align:center;padding:18px;margin:14px 0;position:relative}
.vid .ph{font-size:14px;color:rgba(255,255,255,.55);line-height:1.5}
.vid .rd{position:absolute;top:11px;left:11px;display:flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11px;color:#fff}
.vid .rd i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.wbtn{width:100%;background:#fff;color:var(--dawn);font-size:17px;font-weight:700;
  padding:14px;border-radius:5px;text-align:center;margin-top:9px}
.obtn{width:100%;background:none;border:1.5px solid rgba(255,255,255,.28);color:#fff;
  font-size:16px;font-weight:600;padding:13px;border-radius:5px;text-align:center;margin-top:9px}
.obtn:hover{background:rgba(255,255,255,.12)}
.gbtn{width:100%;background:var(--gold);color:#1a1205;font-size:17px;font-weight:700;
  padding:15px;border-radius:5px;text-align:center;margin-top:9px}

/* \u2500\u2500 \uAC00\uC871 \u2500\u2500 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px}
.pad{padding:26px 28px 28px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.brand b{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--ink3)}
.h1{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.3}
.sub{font-size:13.5px;color:var(--ink2);margin-top:8px}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--dawn);margin-bottom:10px}
.fd{margin-top:15px}
.fd label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:600}
.fd input{width:100%;border:1px solid var(--line);border-radius:4px;padding:12px 13px;font-size:15px;background:#fff;color:var(--ink)}
.fd input:focus{border-color:var(--dawn);outline:none;box-shadow:0 0 0 3px rgba(31,78,95,.12)}
.fd .hl{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.5}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.prim{width:100%;background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;
  padding:15px;border-radius:4px;margin-top:20px;text-align:center}
.prim:hover{opacity:.86}
.prim.gold{background:var(--gold);color:#1a1205}
.lk{display:block;width:100%;text-align:center;margin-top:13px;font-size:13.5px;color:var(--ink2);text-decoration:underline}
.demo{margin-top:18px;background:#F3F6F5;border:1px dashed var(--line);border-radius:4px;
  padding:11px 13px;font-size:12px;color:var(--ink2);line-height:1.6}
.demo b{font-family:var(--mono);font-size:11.5px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:24px}
.rb{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:24px 19px;transition:border-color .15s}
.rb:hover{border-color:var(--dawn)}
.rb .ic{font-size:25px}
.rb .t{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:11px}
.rb .d{font-size:12.5px;color:var(--ink3);margin-top:5px;line-height:1.5}

/* \uC9C0\uBCD1 */
.cgrp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);
  margin:19px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.cwrap{display:flex;flex-wrap:wrap;gap:7px}
.cbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;
  font-size:13.5px;transition:all .13s}
.cbtn:hover{border-color:var(--dawn)}
.cbtn.on{background:var(--dawn);border-color:var(--dawn);color:#fff;font-weight:600}
.prev{margin-top:22px;background:#F8FAFA;border:1px solid var(--line);border-radius:4px;padding:16px 17px}
.prev .pt{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--dawn);margin-bottom:10px}
.prev ol{margin:0;padding-left:19px}
.prev li{font-size:13.5px;margin-bottom:4px}
.prev li b{font-weight:600}
.prev .cap{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.55;
  padding-top:9px;border-top:1px solid var(--line)}
.rule{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.rule span{font-family:var(--mono);font-size:10px;letter-spacing:.05em;background:#EDF3F1;
  border-radius:3px;padding:4px 9px;color:var(--ink2)}

.lbox{display:flex;gap:7px;margin-top:16px}
.lbox input{flex:1;border:1px solid var(--line);border-radius:4px;padding:11px;
  font-family:var(--mono);font-size:12px;background:#F8FAFA;color:var(--ink2)}
.lbox button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;
  padding:0 15px;font-size:13px;font-weight:600;white-space:nowrap}
.chips{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;background:#F1F5F4;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink2)}

/* \uBAA9\uB85D \u2014 \uAC04\uACB0 */
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;gap:10px;flex-wrap:wrap}
.hd h3{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.02em}
.hd .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.row{width:100%;padding:19px 22px;border-bottom:1px solid #EDF1F0;display:flex;
  align-items:center;gap:15px;transition:background .18s}
.row:last-child{border-bottom:none}
.row:hover{background:#F8FAFA}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.r{background:var(--red)} .dot.w{background:var(--gold)} .dot.o{background:var(--jade)}
.rmain{flex:1;min-width:0}
.rname{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.rname em{font-size:12.5px;font-weight:400;color:var(--ink3);font-style:normal;margin-left:7px}
.rwhy{display:block;font-size:13.5px;color:var(--ink2);margin-top:3px}
.rwhy.r{color:#8E2A1B;font-weight:600}
.rgo{font-family:var(--mono);font-size:15px;color:var(--ink3);flex-shrink:0}
.norm{padding:15px 22px;font-size:13px;color:var(--ink3);background:#FAFCFB;border-top:1px solid #EDF1F0}

.al{background:#FBEAE7;border:1px solid #E9BDB5;border-left:4px solid var(--red);border-radius:4px;
  padding:15px 17px;margin-bottom:14px}
.al .t{font-size:14.5px;font-weight:700;color:#8E2A1B}
.al .d{font-size:13px;color:#7A3327;margin-top:5px;line-height:1.5}
.al .a{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.al .a button{background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:9px 15px;border-radius:4px}
.al .a button.g2{background:none;color:#8E2A1B;border:1px solid #D9A79D}

.mail{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#F1F7F5;
  border:1px solid #CFE3DD;border-radius:4px;margin-bottom:14px}
.mail .ic{font-size:19px}
.mail .tx{flex:1;font-size:13.5px;display:block}
.mail .tx b{display:block;font-size:14.5px}
.mail button{background:var(--jade);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:4px;white-space:nowrap}

/* \uC0C1\uC138 \u2014 \uACB0\uB860 \uBA3C\uC800 */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.crumb button{text-decoration:underline}
.top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.r{background:#F8E4E0;color:var(--red)} .pill.w{background:#FBF0DC;color:#9A6410}
.pill.o{background:#E2F0E9;color:var(--jade)}
.concl{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.4;
  letter-spacing:-.02em;margin:14px 0 4px}
.tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tags span{font-size:11px;background:#EDF3F1;border-radius:3px;padding:3px 8px;color:var(--ink2)}
.acts{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.acts button{font-size:14.5px;font-weight:700;padding:13px 22px;border-radius:4px;
  border:1px solid var(--ink);background:var(--ink);color:#fff}
.acts button.g2{background:none;color:var(--ink);border-color:var(--line);font-weight:600}
.acts button.g2:hover{background:var(--mist)}
.quiet{font-size:13.5px;color:var(--jade);font-weight:600;margin-top:18px}
.more{margin-top:20px;padding-top:15px;border-top:1px solid var(--line)}
.more>button{font-size:13px;color:var(--ink2);text-decoration:underline}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);margin:18px 0 8px}
.sig{display:grid;grid-template-columns:88px 1fr 88px;align-items:center;gap:12px;padding:6px 0}
.sig-n{font-size:13px;color:var(--ink2)}
.sig-b{height:6px;background:#EDF1F0;border-radius:3px;overflow:hidden}
.sig-b i{display:block;height:100%;border-radius:3px;transition:width .6s}
.sig-v{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right}
.sp3{display:flex;gap:16px;flex-wrap:wrap}
.sm{flex:1;min-width:108px}
.sm .k{font-size:11.5px;color:var(--ink3)}
.sm .v{font-family:var(--mono);font-size:19px;margin-top:2px}
.sm .c{font-size:11.5px;margin-top:2px}
.up{color:var(--red)} .ok{color:var(--jade)}
.quote{font-family:var(--serif);font-size:15px;background:#F8FAFA;border-radius:4px;
  padding:12px 14px;margin-top:11px;color:var(--ink2);line-height:1.5}
.disc{font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:15px;
  padding-top:12px;border-top:1px solid var(--line)}
.week{display:flex;gap:4px;margin-top:9px;align-items:center}
.week span{width:20px;height:20px;border-radius:2px;background:#EDF1F0}
.week span.y{background:#DCEBE3} .week span.n{background:#F8E4E0}
.week em{font-family:var(--mono);font-size:10px;color:var(--ink3);font-style:normal;margin-left:6px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:#fff;font-size:13.5px;padding:12px 20px;border-radius:5px;
  max-width:90vw;text-align:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.4)}

@media(max-width:520px){
  .rg,.r2{grid-template-columns:1fr}
  .pad{padding:21px 19px 23px}
  .row{padding-left:17px;padding-right:17px}
