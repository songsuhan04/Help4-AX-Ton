<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS "홈 화면에 추가" 아이콘 — Android는 apple-touch-icon을 안 보고 아래 manifest를 본다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Android "홈 화면에 추가"/설치 아이콘 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#404ED7" />
    <meta name="color-scheme" content="dark" />
    <!-- theme.css가 "Pretendard"를 먼저 찾지만 어디서도 불러오지 않아 조용히 맑은고딕으로
         떨어지고 있었다. 알라미 톤에 가장 가까운 Gothic A1을 실제로 불러온다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap"
    />
    <title>Callog(콜록)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
