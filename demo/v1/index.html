<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS "홈 화면에 추가" 아이콘 — Android는 apple-touch-icon을 안 보고 아래 manifest를 본다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Android "홈 화면에 추가"/설치 아이콘 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#404ED7" />
    <meta name="color-scheme" content="dark" />
    <!-- 홈 화면에 추가한 뒤 열었을 때 사파리 주소창 없이 전체화면 앱처럼 보이게 함.
         상태바 스타일은 "black"(반투명 아님)으로 — 반투명은 콘텐츠가 상태바 아래까지
         올라가서 안전영역(safe-area) 패딩을 별도로 잡아줘야 하는데, 지금 화면들은
         그 처리가 없어 노치 기기에서 내용이 가려질 수 있다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Callog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- theme.css가 "Pretendard"를 먼저 찾지만 어디서도 불러오지 않아 조용히 맑은고딕으로
         떨어지고 있었다. 알라미 톤에 가장 가까운 Gothic A1을 실제로 불러온다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap"
    />
    <title>Callog(콜록)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
